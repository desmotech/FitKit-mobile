name: EAS Update (OTA)

# JS-only OTA updates. Native code or plugin changes still require a
# fresh EAS Build (see eas-build.yml) — runtimeVersion in app.config.ts
# is set to `appVersion` so updates only target matching binaries.
#
# Push to main auto-publishes to the `preview` branch (internal/TestFlight
# only). Shipping to production is a deliberate workflow_dispatch run so a
# merge never reaches App Store users without a conscious promotion.
#
# Every update is published with its commit SHA leading the message. The
# update's own id is a UUID EAS mints at publish time and maps to nothing in
# this repo, so the message is the only field on the dashboard (and in
# `eas update:list`) that ties an update back to source. The app stamps the
# same SHA into `extra.commit`, so the device and the dashboard agree.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS branch to publish to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      environment:
        description: 'EAS environment (loads EXPO_PUBLIC_* from eas.json)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      message:
        description: 'Update message (defaults to commit subject)'
        required: false
        type: string

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@desmotech'

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: pnpm install --frozen-lockfile

      # `github.event.head_commit` exists only on push events, so the
      # dispatch path's fallback resolved to an empty string — every manual
      # promotion to production published with no message at all. Git is
      # checked out either way (fetch-depth: 0 above), so resolve from it.
      #
      # `head_commit.message` was also the FULL message, which for the merge
      # commits this repo lands is three lines; the subject alone is what
      # belongs in a one-line dashboard column.
      - name: Resolve update message
        env:
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "UPDATE_MESSAGE<<EOF_UPDATE_MESSAGE"
            echo "$SHA ${INPUT_MESSAGE:-$SUBJECT}"
            echo "EOF_UPDATE_MESSAGE"
          } >> "$GITHUB_ENV"

      - name: Publish update (push to main → preview)
        if: github.event_name == 'push'
        run: |
          eas update \
            --branch preview \
            --environment preview \
            --message "$UPDATE_MESSAGE" \
            --non-interactive

      - name: Publish update (manual dispatch → promote to chosen branch)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          eas update \
            --branch "$INPUT_BRANCH" \
            --environment "$INPUT_ENVIRONMENT" \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
