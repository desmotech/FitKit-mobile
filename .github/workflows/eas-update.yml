name: EAS Update (OTA)

# JS-only OTA updates. Native code or plugin changes still require a
# fresh EAS Build (see eas-build.yml) — runtimeVersion in app.config.ts
# is set to `appVersion` so updates only target matching binaries.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS branch to publish to (preview, production, etc.)'
        required: true
        default: 'preview'
        type: string
      message:
        description: 'Update message (defaults to commit subject)'
        required: false
        type: string

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@desmotech'

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Publish update (push to main → auto branch)
        if: github.event_name == 'push'
        run: eas update --auto --non-interactive

      - name: Publish update (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          eas update \
            --branch "${{ github.event.inputs.branch }}" \
            --message "${{ github.event.inputs.message || github.event.head_commit.message }}" \
            --non-interactive
