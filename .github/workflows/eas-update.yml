name: EAS Update (OTA)

# JS-only OTA updates. Native code or plugin changes still require a
# fresh EAS Build (see eas-build.yml) — runtimeVersion in app.config.ts
# is set to `appVersion` so updates only target matching binaries.
#
# Push to main auto-publishes to the `preview` branch (internal/TestFlight
# only). Shipping to production is a deliberate workflow_dispatch run so a
# merge never reaches App Store users without a conscious promotion.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS branch to publish to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      environment:
        description: 'EAS environment (loads EXPO_PUBLIC_* from eas.json)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      message:
        description: 'Update message (defaults to commit subject)'
        required: false
        type: string

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@desmotech'

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Publish update (push to main → preview)
        if: github.event_name == 'push'
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          eas update \
            --branch preview \
            --environment preview \
            --message "$UPDATE_MESSAGE" \
            --non-interactive

      - name: Publish update (manual dispatch → promote to chosen branch)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          # `github.event.head_commit` only exists on a push payload, so on a
          # dispatch it resolved to empty whenever the optional message input
          # was left blank — and `eas update --message ""` is rejected in
          # non-interactive mode. The fallback could never fire on the one
          # event it was written for. Fall back to the commit being promoted.
          INPUT_MESSAGE: ${{ github.event.inputs.message || format('Manual promotion of {0}', github.sha) }}
        run: |
          # Belt and braces: a blank message fails the run a minute in, after
          # checkout and install, with an error that reads like a CLI problem
          # rather than a missing input.
          if [ -z "${INPUT_MESSAGE// }" ]; then
            echo "::error::Update message resolved to empty; refusing to publish."
            exit 1
          fi
          eas update \
            --branch "$INPUT_BRANCH" \
            --environment "$INPUT_ENVIRONMENT" \
            --message "$INPUT_MESSAGE" \
            --non-interactive
